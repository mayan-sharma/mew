name: Release

# Push a tag like v0.4.0 to build the Windows installer and the macOS app and publish a GitHub Release.
# Run it manually to build both as artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Pick the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            if ($version -ne $cargo) { throw "Tag v$version doesn't match Cargo.toml version $cargo" }
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v7
        with:
          name: Mew-${{ steps.version.outputs.value }}
          path: dist/releases/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: >
          vpk upload github --outputDir dist/releases
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish --releaseName "Mew ${{ steps.version.outputs.value }}" --tag ${{ github.ref_name }}

  # Ad-hoc signed Mew.app (no notarization yet), zipped with ditto so the signature survives.
  # Waits for the Windows job, which creates the release, then attaches the zip to it.
  mac:
    needs: installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Mew.app
        run: scripts/package-mac.sh ${{ needs.installer.outputs.version }}

      - name: Zip it
        run: ditto -c -k --keepParent dist/Mew.app dist/Mew-macOS-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Mew-macOS-${{ needs.installer.outputs.version }}
          path: dist/Mew-macOS-arm64.zip
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/Mew-macOS-arm64.zip --repo "${{ github.repository }}" --clobber
